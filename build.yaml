# This file generates the GitHub Actions matrix.
# See https://zmk.dev/docs/user-setup#customizing-zmk for the format.
---
include:
  # Keyboard: split peripheral (keys + TPS65 trackpad) on nice!nano
  - board: nice_nano//zmk
    shield: thumble
    artifact-name: thumble
  # Same keyboard firmware with USB logging, for trackpad bring-up. Plug the
  # keyboard into USB and open its serial port to see the iqs5xx driver logs.
  - board: nice_nano//zmk
    shield: thumble
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_I2C_LOG_LEVEL_DBG=y -DCONFIG_THUMBLE_I2C_PROBE=y
    artifact-name: thumble_usb_logging
  # Dongle: Xiao nRF52840 + Prospector adapter (ILI9341), ZMK Studio over USB
  - board: xiao_ble//zmk
    shield: thumble_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: thumble_dongle
  # Settings wipe images, one per MCU. Flash, wait ~5s, then re-flash.
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset_nice_nano
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset_xiao

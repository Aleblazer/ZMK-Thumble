# Thumble keyboard (split peripheral) on nice!nano

# No 32 kHz crystal on this controller
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Azoteq TPS65 trackpad (IQS5xx) - forwarded to the dongle
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Every trackpad event goes to the dongle as its own BLE notification. Zephyr's
# default of 3 ACL/ATT TX buffers lets only a few out per connection event, so
# the split input queue backs up ("Input event queue full") while the pad is
# moving. ZMK only raises these on the central.
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_ATT_TX_COUNT=10
# Zephyr asserts EVT_RX_COUNT > ACL_TX_COUNT (one completion event per packet)
CONFIG_BT_BUF_EVT_RX_COUNT=16

# TPS65 report rate (active + idle touch), applied by src/iqs5xx_tune.c.
# Pad default is 13 ms / 50 ms; QMK uses 10 ms. Lower = smoother, more power.
CONFIG_THUMBLE_IQS5XX_REPORT_RATE_MS=10

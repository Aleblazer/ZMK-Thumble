# Thumble DONGLE (central + ZMK Studio host) on Xiao nRF52840 + Prospector

CONFIG_ZMK_STUDIO=y
# No unlock step: Studio can edit the keymap as soon as it connects
CONFIG_ZMK_STUDIO_LOCKING=n

# USB HID output (the dongle is the device that talks to your computer)
CONFIG_ZMK_USB=y

# Peripheral battery level for the status screen
CONFIG_ZMK_BATTERY_REPORTING=y

# Mouse HID for the trackpad events relayed from the keyboard
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Prospector status screen (ILI9341 port) - pick at most one, Classic is default:
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# No ambient light sensor fitted; fixed backlight instead
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Keep the LVGL render buffer practical for the 320x240 panel alongside Studio
CONFIG_LV_Z_VDB_SIZE=25
